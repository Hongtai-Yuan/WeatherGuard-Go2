amcl:
  ros__parameters:
    use_sim_time: false

bt_navigator:
  ros__parameters:
    use_sim_time: false
    global_frame: map
    robot_base_frame: unitree_go2_0/base_link
    odom_topic: /unitree_go2_0/odom
    bt_loop_duration: 10
    default_server_timeout: 20

controller_server:
  ros__parameters:
    use_sim_time: false
    cmd_vel_topic: /unitree_go2_0/cmd_vel
    odom_topic: /unitree_go2_0/odom
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugin: progress_checker
    goal_checker_plugins: [general_goal_checker]
    controller_plugins: [FollowPath]

    current_goal_checker: general_goal_checker

    progress_checker:
      plugin: nav2_controller::SimpleProgressChecker
      required_movement_radius: 0.08
      movement_time_allowance: 20.0

    general_goal_checker:
      stateful: true
      plugin: nav2_controller::SimpleGoalChecker
      xy_goal_tolerance: 0.25
      yaw_goal_tolerance: 0.35

    FollowPath:
      plugin: dwb_core::DWBLocalPlanner
      debug_trajectory_details: false
      min_vel_x: 0.0
      max_vel_x: 0.75
      min_vel_y: 0.0
      max_vel_y: 0.0
      max_vel_theta: 1.1
      min_speed_xy: 0.0
      max_speed_xy: 0.75
      min_speed_theta: 0.0
      acc_lim_x: 1.0
      acc_lim_y: 0.0
      acc_lim_theta: 1.8
      decel_lim_x: -1.2
      decel_lim_y: 0.0
      decel_lim_theta: -1.8
      vx_samples: 12
      vy_samples: 1
      vtheta_samples: 24
      sim_time: 1.4
      linear_granularity: 0.05
      angular_granularity: 0.025
      transform_tolerance: 0.3
      xy_goal_tolerance: 0.25
      trans_stopped_velocity: 0.08
      short_circuit_trajectory_evaluation: true
      stateful: true
      critics: [RotateToGoal, Oscillation, BaseObstacle, GoalAlign, PathAlign, PathDist, GoalDist]
      BaseObstacle.scale: 0.08
      PathAlign.scale: 20.0
      PathAlign.forward_point_distance: 0.35
      GoalAlign.scale: 16.0
      GoalAlign.forward_point_distance: 0.35
      PathDist.scale: 18.0
      GoalDist.scale: 16.0
      RotateToGoal.scale: 20.0
      RotateToGoal.slowing_factor: 4.0
      RotateToGoal.lookahead_time: -1.0

smoother_server:
  ros__parameters:
    use_sim_time: false
    smoother_plugins: [simple_smoother]
    simple_smoother:
      plugin: nav2_smoother::SimpleSmoother
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: true

velocity_smoother:
  ros__parameters:
    use_sim_time: false
    smoothing_frequency: 20.0
    scale_velocities: false
    feedback: OPEN_LOOP
    max_velocity: [0.75, 0.0, 1.1]
    min_velocity: [0.0, 0.0, -1.1]
    max_accel: [1.0, 0.0, 1.8]
    max_decel: [-1.2, 0.0, -1.8]
    odom_topic: /unitree_go2_0/odom
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 10.0
      publish_frequency: 5.0
      global_frame: map
      robot_base_frame: unitree_go2_0/base_link
      transform_tolerance: 1.0
      initial_transform_timeout: 20.0
      rolling_window: true
      width: 6
      height: 6
      resolution: 0.05
      robot_radius: 0.28
      footprint_padding: 0.03
      plugins: [obstacle_layer, inflation_layer]
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        observation_sources: obstacles clearing
        obstacles:
          topic: /unitree_go2_0/elevation/obstacle_cloud
          data_type: PointCloud2
          marking: true
          clearing: false
          min_obstacle_height: 0.05
          max_obstacle_height: 1.00
          obstacle_max_range: 4.0
          raytrace_max_range: 4.5
        clearing:
          topic: /unitree_go2_0/elevation/clearing_cloud
          data_type: PointCloud2
          marking: false
          clearing: true
          min_obstacle_height: 0.05
          max_obstacle_height: 1.00
          obstacle_max_range: 4.0
          raytrace_max_range: 4.5
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        cost_scaling_factor: 5.0
        inflation_radius: 0.36
      always_send_full_costmap: true

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: map
      robot_base_frame: unitree_go2_0/base_link
      transform_tolerance: 1.0
      initial_transform_timeout: 20.0
      rolling_window: true
      width: 24
      height: 24
      resolution: 0.10
      track_unknown_space: false
      unknown_cost_value: 0
      robot_radius: 0.28
      footprint_padding: 0.03
      plugins: [inflation_layer]
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        cost_scaling_factor: 4.0
        inflation_radius: 0.40
      always_send_full_costmap: true

planner_server:
  ros__parameters:
    use_sim_time: false
    expected_planner_frequency: 5.0
    planner_plugins: [GridBased]
    GridBased:
      plugin: nav2_navfn_planner/NavfnPlanner
      tolerance: 1.0
      use_astar: true
      allow_unknown: true

behavior_server:
  ros__parameters:
    use_sim_time: false
    global_frame: map
    robot_base_frame: unitree_go2_0/base_link
    cycle_frequency: 10.0
    behavior_plugins: [spin, backup, wait]
    spin:
      plugin: nav2_behaviors/Spin
    backup:
      plugin: nav2_behaviors/BackUp
    wait:
      plugin: nav2_behaviors/Wait

waypoint_follower:
  ros__parameters:
    use_sim_time: false

lifecycle_manager_navigation:
  ros__parameters:
    use_sim_time: false
    autostart: true
    bond_timeout: 20.0
    service_timeout: 30000
    node_names:
      - controller_server
      - smoother_server
      - planner_server
      - behavior_server
      - bt_navigator
      - waypoint_follower
